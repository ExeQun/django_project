{% extends 'base.html' %}

{% block title %}Регистрация - Конференции.РФ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Регистрация</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Логин</label>
                        <input type="text" name="username" id="id_username" class="form-control"
                               placeholder="Только латиница и цифры, не менее 6 символов" required>
                        <div class="form-text">Только латиница и цифры, не менее 6 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Пароль</label>
                        <input type="password" name="password1" id="id_password1" class="form-control"
                               placeholder="Не менее 8 символов" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Подтверждение пароля</label>
                        <input type="password" name="password2" id="id_password2" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_full_name" class="form-label">ФИО</label>
                        <input type="text" name="full_name" id="id_full_name" class="form-control"
                               placeholder="Иванов Иван Иванович" required>
                        <div class="form-text">Только кириллица и пробелы</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_phone" class="form-label">Телефон</label>
                        <input type="text" name="phone" id="id_phone" class="form-control"
                               placeholder="8(XXX)XXX-XX-XX" required>
                        <div class="form-text">Формат: 8(XXX)XXX-XX-XX</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Электронная почта</label>
                        <input type="email" name="email" id="id_email" class="form-control"
                               placeholder="example@domain.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Создать пользователя</button>
                </form>
                <div class="mt-3 text-center">
                    <p>Уже зарегистрированы? <a href="{% url 'users:login' %}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
